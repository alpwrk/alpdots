# Shell: waybar + rofi + mako + wlogout + bgswitch, included from sway/config.

# App launcher. dmenu_path hands rofi the list of executables and
# `xargs swaymsg exec` keeps the new window on the workspace the launcher
# was opened on.
set $menu dmenu_path | rofi -m -1 -show drun | xargs swaymsg exec --
bindsym Mod1+space exec $menu

# Alt-Tab style wallpaper switcher
# AltGr+# (bindcode, because AltGr+# gives ’ instead of numbersign on de)
bindcode Mod5+51 exec ~/.config/sway/scripts/bgswitch

# AltGr+- : dismiss only the newest notification / AltGr+Shift+- : bring it back
# (bindcode 61 = minus key, AltGr+- gives an en dash on de)
bindcode Mod5+61 exec makoctl dismiss
bindcode Mod5+Shift+61 exec makoctl restore

# Full restart of waybar so style changes actually apply
bindsym $mod+Shift+c exec pkill -x waybar; reload

# Power menu, cursor hidden while it's open
bindsym $mod+Escape exec sh -c 'swaymsg seat seat0 hide_cursor 1; wlogout; pkill wlogout; swaymsg seat seat0 hide_cursor 0'

# Toggle the bar
bindsym $mod+Mod5+comma exec ~/.config/sway/scripts/toggle-waybar.sh

# sway just hands the bar over to waybar
bar {
    swaybar_command waybar
}
