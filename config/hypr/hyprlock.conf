# Minimal lock screen for hyprlock (running under swayfx):
# just a clock and a password field, centered, with square corners.

$font = BigBlueTerm437 Nerd Font Mono
# Symlink set by bgswitch (AltGr+#), so the lock screen follows the desktop wallpaper
$wallpaper = ~/.cache/bgswitch/current

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 0
    blur_size = 10
    brightness = 0.75
    contrast = 0.95
    vibrancy = 0.2
    noise = 0.01
}

# --- Clock (centered, slightly above middle) ---
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.92)
    font_size = 120
    font_family = $font
    position = 0, 0
    halign = center
    valign = center
}

# --- Password field (centered, below clock, square corners) ---
input-field {
    monitor =
    size = 280, 40
    rounding = 0
    outline_thickness = 0
    inner_color = rgba(0, 0, 0, 0)
    font_color = rgb(255, 255, 255)
    font_family = $font
    check_color = rgba(0, 0, 0, 0)
    fail_color = rgba(0, 0, 0, 0)
    capslock_color = rgba(0, 0, 0, 0)
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = 0
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text =
    fail_text = <span foreground="##ffffffdd">Incorrect password ($ATTEMPTS)</span>
    position = 0, -110
    halign = center
    valign = center
}
